name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/vesk --help
          /tmp/clean/bin/python -c "import vesk; print(vesk.__version__)"
          mkdir /tmp/work && cd /tmp/work
          /tmp/clean/bin/vesk init
          test -f vesk.yaml
          /tmp/clean/bin/vesk scan --help
          /tmp/clean/bin/vesk report --help
          /tmp/clean/bin/vesk compare --help
      - name: Install sdist in a clean venv
        run: |
          python -m venv /tmp/clean-sdist
          /tmp/clean-sdist/bin/pip install dist/*.tar.gz
          /tmp/clean-sdist/bin/vesk --help
