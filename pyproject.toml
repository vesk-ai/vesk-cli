[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vesk"
dynamic = ["version"]
description = "Vesk Verify: test LLM endpoints and produce compliance-mapped reports."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vesk" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "httpx>=0.27",
  "PyYAML>=6",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy", "types-PyYAML", "build"]

[project.scripts]
vesk = "vesk.cli:app"

[tool.hatch.version]
path = "src/vesk/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/vesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
strict = false
files = ["src/vesk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
